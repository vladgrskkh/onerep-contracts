openapi: 3.1.0
info:
  title: OneRep Gym API
  version: 1.0.0
  description: Core gym domain — exercises, templates, workouts, progress tracking
servers:
  - url: http://localhost:8081/v1

paths:
  /health:
    get:
      operationId: health
      summary: Check service health
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /exercises:
    get:
      operationId: listExercises
      summary: List exercises
      description: List exercises, optionally filtered by search, muscle group, and last-updated time.
      security:
        - BearerAuth: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Search by exercise name.
        - name: muscle_group
          in: query
          schema:
            type: string
          description: Filter by muscle group name.
        - name: since
          in: query
          schema:
            type: string
            format: date-time
          description: Only return exercises updated after this RFC 3339 timestamp.
      responses:
        "200":
          description: Exercises matching the filters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExerciseResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      operationId: createExercise
      summary: Create an exercise
      description: Create a custom exercise for the authenticated user.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExerciseCreateRequest"
      responses:
        "201":
          description: Exercise created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExerciseResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: One or more referenced muscle groups do not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /exercises/{id}:
    parameters:
      - $ref: "#/components/parameters/ExerciseID"
    get:
      operationId: getExercise
      summary: Get an exercise
      description: Get an exercise by ID, including its media and muscle groups.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Exercise details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExerciseResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      operationId: updateExercise
      summary: Update an exercise
      description: Patch an existing exercise; fields omitted from the request are left unchanged.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExerciseUpdateRequest"
      responses:
        "200":
          description: Exercise updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExerciseResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      operationId: deleteExercise
      summary: Delete an exercise
      description: Soft-delete an existing exercise.
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Exercise deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /exercises/{id}/media:
    parameters:
      - $ref: "#/components/parameters/ExerciseID"
    post:
      operationId: uploadExerciseMedia
      summary: Create an exercise media upload
      description: Register a photo or video for an exercise and return a presigned URL for uploading the file. The request body is JSON, not multipart.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExerciseMediaUploadRequest"
      responses:
        "201":
          description: Media registered and presigned upload URL issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaUploadResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /templates:
    get:
      operationId: listTemplates
      summary: List templates
      description: List the authenticated user's templates, or all public templates when public is true.
      security:
        - BearerAuth: []
      parameters:
        - name: public
          in: query
          schema:
            type: boolean
            enum: [true]
          description: Set to true to list public templates instead of the user's own templates.
        - name: since
          in: query
          schema:
            type: string
            format: date-time
          description: Only return templates updated after this RFC 3339 timestamp.
      responses:
        "200":
          description: Templates matching the filters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TemplateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      operationId: createTemplate
      summary: Create a template
      description: Create a custom template with a list of exercises and planned sets.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateCreateRequest"
      responses:
        "201":
          description: Template created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /templates/{id}:
    parameters:
      - $ref: "#/components/parameters/TemplateID"
    get:
      operationId: getTemplate
      summary: Get a template
      description: Get a template by ID, including its exercises and media. Public templates are readable by any authenticated user; private templates are readable by their owner.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Template details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      operationId: updateTemplate
      summary: Update a template
      description: Patch an existing template; fields omitted from the request are left unchanged.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateUpdateRequest"
      responses:
        "200":
          description: Template updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      operationId: deleteTemplate
      summary: Delete a template
      description: Soft-delete an owned template.
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Template deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /templates/{id}/publish:
    parameters:
      - $ref: "#/components/parameters/TemplateID"
    post:
      operationId: publishTemplate
      summary: Publish a template
      description: Make an owned template publicly visible to other users.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Template published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /templates/{id}/fork:
    parameters:
      - $ref: "#/components/parameters/TemplateID"
    post:
      operationId: forkTemplate
      summary: Fork a template
      description: Copy a public template, or an own private template, including its exercises and media, as the authenticated user's own.
      security:
        - BearerAuth: []
      responses:
        "201":
          description: Template forked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /templates/{id}/media:
    parameters:
      - $ref: "#/components/parameters/TemplateID"
    post:
      operationId: uploadTemplateMedia
      summary: Create a template media upload
      description: Register a photo for a template and return a presigned URL for uploading the file. Template media is photo-only and the request body is JSON, not multipart.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateMediaUploadRequest"
      responses:
        "201":
          description: Media registered and presigned upload URL issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaUploadResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /workouts:
    post:
      operationId: startWorkout
      summary: Start a workout
      description: Start a workout for the authenticated user, optionally from a template. An empty body starts a workout without a template.
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartWorkoutRequest"
      responses:
        "201":
          description: Workout started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkoutResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
    get:
      operationId: listWorkouts
      summary: List workouts
      description: List the authenticated user's workouts, optionally filtered by last-updated time.
      security:
        - BearerAuth: []
      parameters:
        - name: since
          in: query
          schema:
            type: string
            format: date-time
          description: Only return workouts updated after this RFC 3339 timestamp.
      responses:
        "200":
          description: Workouts matching the filter
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkoutResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /workouts/{id}:
    parameters:
      - $ref: "#/components/parameters/WorkoutID"
    get:
      operationId: getWorkout
      summary: Get a workout
      description: Get a workout by ID, including its exercises and sets.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Workout details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkoutResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /workouts/{id}/exercises:
    parameters:
      - $ref: "#/components/parameters/WorkoutID"
    post:
      operationId: addExerciseToWorkout
      summary: Add an exercise to a workout
      description: Append an exercise to the authenticated user's workout.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddExerciseRequest"
      responses:
        "201":
          description: Exercise added to the workout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkoutExerciseResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /workouts/{id}/exercises/{exId}/sets:
    parameters:
      - $ref: "#/components/parameters/WorkoutID"
      - $ref: "#/components/parameters/WorkoutExerciseID"
    post:
      operationId: logSet
      summary: Log a set
      description: Log a set against a workout exercise; returns the estimated one-rep max using the Epley formula and whether it is a new personal record.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogSetRequest"
      responses:
        "201":
          description: Set logged with PR status and estimated 1RM
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogSetResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /workouts/{id}/finish:
    parameters:
      - $ref: "#/components/parameters/WorkoutID"
    patch:
      operationId: finishWorkout
      summary: Finish a workout
      description: Mark the authenticated user's workout as completed and enqueue its volume recalculation.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Workout finished
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkoutResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /progress/1rm:
    get:
      operationId: get1RM
      summary: Get 1RM progress
      description: Get the authenticated user's estimated one-rep max history for an exercise, optionally filtered by RFC 3339 date-time range.
      security:
        - BearerAuth: []
      parameters:
        - name: exercise_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          schema:
            type: string
            format: date-time
          description: Start of the date-time range.
        - name: to
          in: query
          schema:
            type: string
            format: date-time
          description: End of the date-time range.
      responses:
        "200":
          description: 1RM history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OneRMResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /progress/volume:
    get:
      operationId: getVolume
      summary: Get volume progress
      description: Get the authenticated user's total volume per muscle group, optionally filtered by RFC 3339 date-time range.
      security:
        - BearerAuth: []
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date-time
          description: Start of the date-time range.
        - name: to
          in: query
          schema:
            type: string
            format: date-time
          description: End of the date-time range.
      responses:
        "200":
          description: Volume per muscle group
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VolumeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /progress/body-weight:
    get:
      operationId: getBodyWeight
      summary: List body weight entries
      description: List the authenticated user's body weight entries, optionally filtered by last-updated time.
      security:
        - BearerAuth: []
      parameters:
        - name: since
          in: query
          schema:
            type: string
            format: date-time
          description: Only return entries updated after this RFC 3339 timestamp.
      responses:
        "200":
          description: Body weight history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BodyWeightResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      operationId: logBodyWeight
      summary: Log a body weight
      description: Record a body weight entry for the authenticated user; measured_at defaults to now.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogBodyWeightRequest"
      responses:
        "201":
          description: Body weight recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BodyWeightResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  parameters:
    ExerciseID:
      name: id
      in: path
      required: true
      description: Exercise ID
      schema:
        type: string
        format: uuid
    TemplateID:
      name: id
      in: path
      required: true
      description: Template ID
      schema:
        type: string
        format: uuid
    WorkoutID:
      name: id
      in: path
      required: true
      description: Workout ID
      schema:
        type: string
        format: uuid
    WorkoutExerciseID:
      name: exId
      in: path
      required: true
      description: Workout exercise ID
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Invalid request, path parameter, query parameter, or validation failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The authenticated user cannot access this resource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: The request conflicts with the current resource state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"

    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        user_message:
          type: string
        details:
          type: array
          items:
            $ref: "#/components/schemas/ValidationDetail"

    ValidationDetail:
      type: object
      properties:
        field:
          type: string
        tag:
          type: string
        param:
          type: string

    ExerciseCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
        description:
          type: string
        notes:
          type: string
        muscle_group_ids:
          type: array
          items:
            type: integer
            minimum: 1

    ExerciseUpdateRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        description:
          type: string
        notes:
          type: string
        muscle_group_ids:
          type: array
          items:
            type: integer
            minimum: 1

    ExerciseResponse:
      type: object
      required: [id, name, is_built_in, created_at, updated_at, version]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        notes:
          type: string
        is_built_in:
          type: boolean
        created_by_user_id:
          type: string
          format: uuid
          description: Omitted for built-in exercises.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
        media:
          type: array
          items:
            $ref: "#/components/schemas/ExerciseMediaResponse"
        muscle_groups:
          type: array
          items:
            $ref: "#/components/schemas/MuscleGroupResponse"

    ExerciseMediaResponse:
      type: object
      required: [id, media_type, sort_order, s3_key]
      properties:
        id:
          type: string
          format: uuid
        media_type:
          type: string
          enum: [photo, video]
        sort_order:
          type: integer
        s3_key:
          type: string

    MuscleGroupResponse:
      type: object
      required: [id, is_primary]
      properties:
        id:
          type: integer
        is_primary:
          type: boolean

    ExerciseMediaUploadRequest:
      type: object
      required: [media_type, content_type]
      properties:
        media_type:
          type: string
          enum: [photo, video]
        content_type:
          type: string
          description: MIME type of the file to upload, for example image/jpeg or video/mp4.

    TemplateMediaUploadRequest:
      type: object
      required: [content_type]
      properties:
        content_type:
          type: string
          description: MIME type of the image to upload, for example image/jpeg.

    MediaUploadResponse:
      type: object
      required: [id, s3_key, upload_url]
      properties:
        id:
          type: string
          format: uuid
        s3_key:
          type: string
        upload_url:
          type: string
          format: uri
        expires_in:
          type: integer
          format: int64
          description: Presigned URL lifetime in seconds.

    TemplateCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
        description:
          type: string
        exercises:
          type: array
          items:
