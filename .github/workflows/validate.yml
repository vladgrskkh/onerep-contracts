name: Validate Contracts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
      - run: npx @apidevtools/swagger-cli validate auth/v1/openapi.yaml gym/v1/openapi.yaml
